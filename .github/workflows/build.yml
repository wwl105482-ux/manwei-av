name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate script encoding
        shell: powershell
        run: |
          $bad = @()
          Get-ChildItem -Filter *.ps1 | ForEach-Object {
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            $hasBom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            $start = 0
            if ($hasBom) { $start = 3 }
            $hasNonAscii = $false
            for ($i = $start; $i -lt $bytes.Length; $i++) {
              if ($bytes[$i] -gt 127) { $hasNonAscii = $true; break }
            }
            if ($hasNonAscii -and (-not $hasBom)) { $bad += $_.Name }
          }
          if ($bad.Count -gt 0) {
            throw ("These scripts contain non-ASCII text but no UTF-8 BOM: " + ($bad -join ', '))
          }
          Write-Host "script encoding ok"

      - name: Show toolchain
        shell: powershell
        run: |
          $csc = Join-Path $env:SystemRoot 'Microsoft.NET\Framework64\v4.0.30319\csc.exe'
          Write-Host "csc: $csc"
          if (-not (Test-Path $csc)) { throw 'csc.exe not found' }

      - name: Build
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build.ps1

      - name: Build installer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File build-installer.ps1

      - name: Self test
        shell: powershell
        run: |
          $name = -join ([char[]](0x6EE1,0x552F,0x6740,0x6BD2))
          $exe = Join-Path (Get-Location) ('dist\' + $name + '.exe')
          $out = & $exe --selftest 2>&1 | Out-String
          Write-Host $out
          if ($out -notmatch 'ALL PASS') { throw 'selftest failed' }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manwei-av-${{ github.sha }}
          path: |
            dist/*.exe
            dist/rules/signatures.json
          if-no-files-found: error
          retention-days: 14
